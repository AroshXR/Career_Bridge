# Netlify Configuration File
# This file automates your build settings so you don't have to set them manually in the dashboard.

[build]
  # The directory where the frontend code is located
  base = "frontend/"
  
  # The command to build the project
  command = "npm run build"
  
  # The directory that Netlify will serve (relative to the base directory)
  # For Create React App, this is "build"
  publish = "build/"

# Handle Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
